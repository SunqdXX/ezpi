name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: daemon/go.sum
      - name: gofmt
        working-directory: daemon
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: daemon
        run: go vet ./...
      - name: test
        working-directory: daemon
        run: go test -race ./...
      - name: build
        working-directory: daemon
        run: go build -ldflags="-s -w" -o /tmp/ezpi .
      - name: installer syntax
        run: bash -n install.sh
